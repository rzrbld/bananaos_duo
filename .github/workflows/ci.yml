name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Host build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libdrm-dev libfreetype-dev libasound2-dev zlib1g-dev
      - name: Reconstruct source and test A/B updates and hardware policy
        run: make test
      - name: Compile launcher and test unequal-panel presentation
        working-directory: build/source/ui
        run: |
          make host
          make tests/plane-selection-test tests/scanout-test tests/splash-test
          make ALSA=0 CXXFLAGS=-O0 tests/settings-layout-test
          make tests/app-tiles-test
          tests/app-tiles-test "$RUNNER_TEMP/app-tiles"
          tests/plane-selection-test
          tests/scanout-test
          tests/splash-test
          tests/settings-layout-test assets/rnds "$RUNNER_TEMP/settings-layout"
      - name: Upload UI layout regression renders
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: settings-layout-renders
          path: ${{ runner.temp }}/settings-layout
          retention-days: 3
          if-no-files-found: ignore
      - name: Check shell and Python syntax
        run: |
          sh -n scripts/build.sh
          sh -n build/source/system/rootfs/usr/libexec/banana/update
          sh -n build/source/system/rootfs/usr/libexec/banana/update-duolite-boot
          python3 -m compileall -q scripts tests
