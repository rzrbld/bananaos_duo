image boot.vfat {
    vfat {
        label = "BANANA-BOOT"
        file openabl { image = "openabl" }
        file Image { image = "Image" }
        file dtbs/qcom/sm6125-retroid-pocket-duo-lite.dtb { image = "sm6125-retroid-pocket-duo-lite.dtb" }
        file loader/entries/banana.conf { image = "banana.conf" }
    }
    size = 256M
}
image banana-duolite.img {
    hdimage { partition-table-type = "gpt" }
    partition boot {
        partition-type-uuid = "EBD0A0A2-B9E5-4433-87C0-68B6B72699C7"
        bootable = true
        image = "boot.vfat"
        offset = 16M
    }
    partition banana-root-a {
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
        image = "rootfs.squashfs"
        size = 1G
    }
    partition banana-root-b {
        partition-type-uuid = "0FC63DAF-8483-4772-8E79-3D69D8477DE4"
        size = 1G
    }
}
