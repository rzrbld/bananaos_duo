# Native Freedreno GLES/KMS avoids full-frame GPU readback and CPU rotation.
video_driver = "gl"
video_context_driver = "kms"
video_monitor_index = "1"
video_fullscreen = "true"
video_fullscreen_x = "1080"
video_fullscreen_y = "1920"
video_windowed_fullscreen = "false"
video_rotation = "1"
video_vsync = "true"
video_threaded = "false"
# SDL2 viewport readback in RetroArch1.22 can overrun a cropped viewport.
# Capture the software core's framebuffer instead.
video_gpu_screenshot = "false"
input_driver = "sdl2"
input_joypad_driver = "sdl2"
input_autodetect_enable = "true"
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig"
audio_driver = "alsa"
audio_device = "default"
system_directory = "/data/bios"
savefile_directory = "/data/saves"
savestate_directory = "/data/states"
screenshot_directory = "/data/screenshots"
assets_directory = "/usr/share/retroarch/assets"
menu_driver = "rgui"
config_save_on_exit = "false"
quit_press_twice = "false"
input_enable_hotkey_btn = "5"
input_exit_emulator_btn = "6"

# Use each core's intended geometry (GB 10:9, GBA 3:2, NES/SNES 4:3),
# with rotation handled by the native video driver.
aspect_ratio_index = "22"
video_force_aspect = "true"
video_scale_integer = "false"
# BananaOS supplies the status, save/load and controller feedback on screen two.
video_font_enable = "false"
notification_show_autoconfig = "false"
notification_show_save_state = "false"
notification_show_load_state = "false"
notification_show_set_initial_disk = "false"
menu_show_load_content_animation = "false"

# Match the F combinations printed on BananaOS's lower game panel.
input_save_state_btn = "10"
input_load_state_btn = "9"
input_menu_toggle_btn = "nul"
input_toggle_fast_forward_axis = "+5"

# Original BananaOS slot previews use RetroArch state thumbnails.
savestate_thumbnail_enable = "true"
