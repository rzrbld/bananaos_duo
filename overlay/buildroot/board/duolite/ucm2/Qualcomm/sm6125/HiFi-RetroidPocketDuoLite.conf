# Use case configuration for Retroid Pocket Duo Lite (SM6125).
# Audio paths:
#   Speaker:     MM1 -> PRI_MI2S_RX       -> AW88166 x2      (playback PCM 0)
#   Headphones:  MM2 -> RX_CODEC_DMA_RX_0 -> RX macro -> WCD937x (playback PCM 1)
#   Mic:         MM3 <- TX_CODEC_DMA_TX_3 <- TX macro DEC0 <- DMIC2    (capture PCM 2)
#   Headset Mic: MM3 <- TX_CODEC_DMA_TX_3 <- TX macro DEC0 <- WCD937x ADC2 (capture PCM 2)

SectionVerb {

	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 1"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' 0"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker Playback"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		cset "name='SPK_L Speaker Switch' 1"
		cset "name='SPK_R Speaker Switch' 1"
	]

	DisableSequence [
		cset "name='SPK_L Speaker Switch' 0"
		cset "name='SPK_R Speaker Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
		PlaybackMixer "default:${CardId}"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones Playback"

	ConflictingDevice [
		"Speaker"
	]

	# Keep the working Linux headphone path independent of shared sequence
	# ordering. Android's companders stalled this driver and remain disabled.
	EnableSequence [
		cset "name='RX_HPH PWR Mode' LOHIFI"
		cset "name='RX HPH Mode' CLS_H_LOHIFI"
		cset "name='RX_COMP1 Switch' 0"
		cset "name='RX_COMP2 Switch' 0"
		cset "name='HPHL_COMP Switch' 0"
		cset "name='HPHR_COMP Switch' 0"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='HPHL_RDAC Switch' 1"
		cset "name='HPHR_RDAC Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='HPHR Switch' 1"
	]

	DisableSequence [
		cset "name='HPHL_RDAC Switch' 0"
		cset "name='HPHR_RDAC Switch' 0"
		cset "name='HPHL Switch' 0"
		cset "name='HPHR Switch' 0"
		cset "name='RX_MACRO RX0 MUX' ZERO"
		cset "name='RX_MACRO RX1 MUX' ZERO"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
		cset "name='RX INT0 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT1 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX_COMP1 Switch' 0"
		cset "name='RX_COMP2 Switch' 0"
		cset "name='HPHL_COMP Switch' 0"
		cset "name='HPHR_COMP Switch' 0"
		cset "name='RX HPH Mode' CLS_H_INVALID"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},1"
		PlaybackChannels 2
		PlaybackRate 48000
		PlaybackMixer "default:${CardId}"
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Built-in Microphone"

	ConflictingDevice [
		"Headset"
	]

	EnableSequence [
		cset "name='TX DEC0 MUX' MSM_DMIC"
		cset "name='TX DMIC MUX0' DMIC2"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
	]

	DisableSequence [
		cset "name='TX DMIC MUX0' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
		CaptureChannels 1
		CaptureRate 48000
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic"
	]

	Include.wcdmice.File "/codecs/wcd937x/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd937x/HeadphoneMicDisableSeq.conf"

	# Android routes ADC2 over master TX port 3 channel bit 1: SWR_MIC2.
	# Keep this aligned with the sound card audio-routing in the device tree.
	EnableSequence [
		cset "name='ADC2 Volume' 12"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC2"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
	]

	DisableSequence [
		cset "name='TX SMIC MUX0' ZERO"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},2"
		CaptureChannels 1
		CaptureRate 48000
		CaptureMixerElem "ADC2"
		JackControl "Mic Jack"
	}
}
